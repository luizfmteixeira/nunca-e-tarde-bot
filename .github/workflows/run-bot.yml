name: Executar Bot Diariamente

on:
  schedule:
    - cron: '0 7 * * *'  # 10:00 BR (13:00 UTC)
  workflow_dispatch:

jobs:
  executar-bot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Debug Timezone
        run: |
          sudo timedatectl set-timezone America/Sao_Paulo
          echo "🕐 Timezone ajustado:"
          date

      - name: Compilar
        run: mvn clean compile

      - name: Executar Bot
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}  # 🔥 NOME EXATO!
        run: |
          echo "🚀 Iniciando bot..."
          echo "📏 Tamanho da credencial: ${#SERVICE_ACCOUNT_JSON} caracteres"
          mvn exec:java -Dexec.mainClass="com.nuncaetardebot.NuncaETardeBot"