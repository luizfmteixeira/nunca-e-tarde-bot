name: Executar Bot Diariamente

on:
  schedule:
    # CRON: Minuto Hora Dia Mês Dia-da-semana
    # TODO DIA ÀS 10:00 DA MANHÃ (Horário UTC)
    # Para horário Brasil (UTC-3), subtraia 3 horas
    # Ex: 10:00 BR = 13:00 UTC
    - cron: '0 13 * * *'  # 10:00 horário Brasil

  workflow_dispatch:  # Permite rodar manualmente

jobs:
  executar-bot:
    runs-on: ubuntu-latest

    steps:
      # 1. Baixa o código
      - name: Checkout código
        uses: actions/checkout@v3

      # 2. Configura Java (VERSÃO CORRIGIDA)
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'  # OU 'corretto' ou 'zulu'

      # 3. Executa Maven
      - name: Compilar com Maven
        run: |
          mvn --version
          mvn clean compile

      # 4. Executa o bot
      - name: Rodar Bot
        env:
          # VARIÁVEIS DE AMBIENTE - Configure no GitHub Secrets
          # Exemplo: criar secret "GOOGLE_CREDENTIALS_JSON"
          CREDENTIALS_JSON: ${{ secrets.CREDENTIALS_JSON }}
        run: |
          echo '🚀 Iniciando execução do bot...'
          echo '📅 Data: $(date)'
          
          # Se precisar criar arquivo de credenciais a partir da variável
          if [ -n "$CREDENTIALS_JSON" ]; then
            echo "$CREDENTIALS_JSON" > credentials.json
            echo '✅ Credenciais criadas'
          fi
          
          # Executa o bot
          mvn exec:java -Dexec.mainClass="com.nuncaetardebot.NuncaETardeBot"
          
          echo '🎉 Bot executado com sucesso!'