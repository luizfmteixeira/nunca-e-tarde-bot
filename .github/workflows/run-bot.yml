name: Executar Bot Diariamente

on:
  schedule:
    - cron: '0 7 * * *'  # 10:00 BR (13:00 UTC)
  workflow_dispatch:

jobs:
  executar-bot:
    runs-on: ubuntu-latest
    env:  # ⭐⭐ VARIÁVEIS AQUI, NO NÍVEL DO JOB ⭐⭐
      SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
      TZ: America/Sao_Paulo

    steps:
      - uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Debug - Verificar variáveis
        run: |
          echo "🔍 Debug informações:"
          echo "Timezone: $TZ"
          echo "Credencial tamanho: ${#SERVICE_ACCOUNT_JSON} caracteres"
          echo "Primeiros 50 chars: ${SERVICE_ACCOUNT_JSON:0:50}"
          date

      - name: Compilar
        run: mvn clean compile

      - name: Executar Bot
        run: |
          echo "🚀 Iniciando bot..."
          mvn exec:java -Dexec.mainClass="com.nuncaetardebot.NuncaETardeBot"